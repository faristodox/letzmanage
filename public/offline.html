<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Offline — Letz Manage</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #f8fafc;
            color: #0f172a;
            padding: 1.5rem;
        }
        .card {
            max-width: 24rem;
            text-align: center;
        }
        .logo {
            width: 3.5rem;
            height: 3.5rem;
            border-radius: 1rem;
            margin: 0 auto 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1.5rem;
            color: #fff;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
        }
        h1 {
            font-size: 1.25rem;
            margin: 0 0 0.5rem;
        }
        p {
            color: #64748b;
            line-height: 1.5;
            margin: 0 0 1.5rem;
        }
        button {
            font: inherit;
            font-weight: 600;
            color: #fff;
            background: #4f46e5;
            border: none;
            border-radius: 0.5rem;
            padding: 0.6rem 1.25rem;
            cursor: pointer;
        }
        button:hover {
            background: #4338ca;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">L</div>
        <h1>You're offline</h1>
        <p>Letz Manage needs an internet connection. Check your connection and try again.</p>
        <button onclick="location.reload()">Retry</button>
    </div>
</body>
</html>
